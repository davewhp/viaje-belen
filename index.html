<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#01112a">
  <title>Validar entradas · El último llamado a Belén</title>
<style>
    :root {
      --noche: #01112a; --azul: #225074; --cian: #3aeee3; --lima: #e7f847;
      --luz: #f4ecdc; --tenue: #a9c3d8; --linea: rgba(169, 195, 216, .3);
      --panel: rgba(4, 24, 52, .78); --r: 18px;
      --tit: 'Helvetica Now Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; color: var(--luz); font: 500 16px/1.5 var(--tit);
      background-color: var(--noche);
      background-image:
        radial-gradient(1.4px 1.4px at 8% 10%, #fff 98%, transparent), radial-gradient(1px 1px at 22% 26%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 38% 7%, #fff 98%, transparent), radial-gradient(1px 1px at 61% 18%, #fff 98%, transparent),
        radial-gradient(1.3px 1.3px at 77% 9%, #e7f847 98%, transparent), radial-gradient(1px 1px at 92% 22%, #fff 98%, transparent),
        radial-gradient(70% 40% at 80% 0%, rgba(58, 238, 227, .14) 0%, rgba(58, 238, 227, 0) 70%),
        linear-gradient(180deg, #01112a 0%, #0a2850 60%, #123a63 100%);
      background-attachment: fixed;
    }
    [hidden] { display: none !important; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 22px 16px 48px; }

    .hero { text-align: center; padding: 6px 0 20px; }
    .logo { width: 200px; margin: 0 auto 14px; color: var(--cian); filter: drop-shadow(0 0 14px rgba(58, 238, 227, .35)); }
    .logo svg { display: block; width: 100%; height: auto; }
    .eyebrow { margin: 0 0 4px; font: 800 12px/1 var(--tit); letter-spacing: .16em; text-transform: uppercase; color: var(--lima); }
    h1 { margin: 0; font: italic 900 30px/1.05 var(--tit); text-transform: uppercase; color: var(--luz); }

    .card { background: var(--panel); border: 1.5px solid rgba(58, 238, 227, .18); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
    label { display: block; margin-bottom: 16px; font: 800 12px/1 var(--tit); letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
    input {
      display: block; width: 100%; height: 52px; margin-top: 8px; padding: 0 14px; border-radius: 13px;
      border: 1.6px solid rgba(169, 195, 216, .4); background: rgba(1, 17, 42, .65); color: var(--luz);
      font: 600 18px var(--tit); letter-spacing: .04em;
    }
    input::placeholder { color: rgba(244, 236, 220, .55); letter-spacing: 0; font-weight: 500; }
    input:focus { outline: 0; border-color: var(--cian); box-shadow: 0 0 0 3px rgba(58, 238, 227, .22); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; padding: 14px 18px;
      border: 0; border-radius: 999px; cursor: pointer; text-decoration: none; text-align: center;
      font: italic 900 20px/1 var(--tit); letter-spacing: -.01em; text-transform: none;
      color: var(--noche); background: linear-gradient(180deg, #f2ff7a 0%, #d3e626 100%);
      box-shadow: 0 5px 0 #8fa015, 0 0 30px -8px rgba(231, 248, 71, .6);
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8fa015; }
    .btn:disabled { opacity: .65; cursor: wait; }
    .btn:focus-visible { outline: 3px solid var(--cian); outline-offset: 3px; }
    .btn.sec { color: var(--luz); background: transparent; border: 1.6px solid rgba(244, 236, 220, .55); box-shadow: none; font-size: 18px; }
    label.btn { margin-bottom: 0; }
    .link { display: block; margin: 16px auto 0; background: none; border: 0; color: var(--tenue); text-decoration: underline; font: 500 15px var(--tit); cursor: pointer; }
    .error { margin: 0 0 16px; padding: 11px 13px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #ffd9d2; background: rgba(255, 107, 87, .14); border: 1.5px solid rgba(255, 107, 87, .5); }

    .fila { display: flex; gap: 8px; align-items: center; }
    .fila input { margin: 0; text-transform: uppercase; }
    .fila .btn { width: auto; min-height: 52px; padding: 12px 18px; font-size: 16px; flex: none; }
    .mono { font-family: ui-monospace, Menlo, monospace; letter-spacing: .1em; color: var(--tenue); }

    /* Resultados de la validación: verde = entra, rojo = no entra */
    .estado { padding: 26px 20px 22px; text-align: center; border-radius: var(--r); margin-bottom: 16px; border: 2px solid var(--linea); background: var(--panel); }
    .estado h2 { margin: 0 0 8px; font: italic 900 30px/1.05 var(--tit); text-transform: uppercase; }
    .estado p { margin: 4px 0; font-size: 17px; }
    .estado strong { font-weight: 900; }
    .estado .btn { margin-top: 16px; }
    .estado.info { border-color: rgba(58, 238, 227, .5); }
    .estado.info h2 { color: var(--cian); }
    .estado.ok { background: rgba(46, 204, 113, .18); border-color: #4be08a; box-shadow: 0 0 40px -10px rgba(75, 224, 138, .6); }
    .estado.ok h2 { color: #7dffb0; }
    .estado.bad { background: rgba(255, 92, 72, .16); border-color: #ff7a66; box-shadow: 0 0 40px -10px rgba(255, 92, 72, .55); }
    .estado.bad h2 { color: #ffa497; }
    .icono { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; font-size: 36px; font-weight: 900; }
    .ok-bg { background: rgba(75, 224, 138, .22); color: #7dffb0; }
    .bad-bg { background: rgba(255, 92, 72, .22); color: #ffa497; }
    .warn-bg { background: rgba(58, 238, 227, .16); color: var(--cian); }
    .funcion-tag { display: inline-block; margin: 2px 0 12px; padding: 7px 16px; border-radius: 999px; font: italic 900 21px/1.1 var(--tit); color: var(--noche); background: var(--lima); box-shadow: 0 0 22px -4px rgba(231, 248, 71, .7); }
    #lector { padding: 0; overflow: hidden; border-color: rgba(58, 238, 227, .5); }
    #lector video { display: block; width: 100% !important; border-radius: 16px; }
    #btnCam.sec { color: var(--luz); background: transparent; border: 1.6px solid rgba(244, 236, 220, .55); box-shadow: none; }
  </style>
</head>

    <p class="eyebrow">Control de acceso · Abordaje</p>
    <h1>Validar entradas</h1>
  </header>

  <section id="pinBox" class="card" hidden>
    <form id="pinForm">
      <label>PIN del validador
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
      </label>
      <p id="pinErr" class="error" hidden></p>
      <button class="btn" id="btnPin">Entrar</button>
    </form>
  </section>

  <section id="app" hidden>
    <div id="res"></div>
    <div id="lector" class="card" hidden></div>
    <button id="btnCam" class="btn" type="button">📷 Escanear QR</button>
    <form id="manual" class="card fila" style="margin-top:16px">
      <input id="codigo" placeholder="O escribe el código" autocomplete="off" autocapitalize="characters">
      <button class="btn">Buscar</button>
    </form>
    <button id="salir" class="link" type="button">Cambiar PIN</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // Respaldo por si el primer CDN no carga
  if (!window.Html5Qrcode) document.write('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>');
</script>
<script>
  // URL de la app web de Apps Script (la que termina en /exec)
  const API = 'https://script.google.com/macros/s/AKfycbyOUzz7kQe5_Igw-pZnlmPpBSoyh1vuRLQfd4bcH1njQCJj7GzkVXcHhDLeMiHTSkgT/exec';

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let memPin = '', lector = null, camActiva = false, ocupado = false;

  const pinStore = {
    get() { try { return localStorage.getItem('pinValidador') || memPin; } catch (e) { return memPin; } },
    set(v) { memPin = v; try { localStorage.setItem('pinValidador', v); } catch (e) {} },
    del() { memPin = ''; try { localStorage.removeItem('pinValidador'); } catch (e) {} }
  };

  async function api(accion, params) {
    const q = new URLSearchParams(Object.assign({ api: accion, t: Date.now() }, params));
    let r;
    try { r = await fetch(API + '?' + q.toString(), { method: 'GET', redirect: 'follow' }); }
    catch (e) { throw new Error('Sin conexión. Revisa el internet e intenta de nuevo.'); }
    let data;
    try { data = await r.json(); }
    catch (e) { throw new Error('La app no respondió bien. Revisa que esté publicada para "Cualquier persona".'); }
    if (data.error) throw new Error(data.error);
    return data;
  }

  /* ---------- PIN ---------- */
  function mostrarPin(msg) {
    $('app').hidden = true; $('pinBox').hidden = false;
    $('pinErr').textContent = msg || ''; $('pinErr').hidden = !msg;
    $('pin').focus();
  }
  function mostrarApp() { $('pinBox').hidden = true; $('app').hidden = false; }

  $('pinForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('pin').value.trim();
    $('btnPin').disabled = true; $('btnPin').textContent = 'Verificando…';
    try {
      await api('pin', { pin });
      pinStore.set(pin); $('pin').value = '';
      mostrarApp();
      if (CODIGO_URL) consultar(CODIGO_URL);
    } catch (err) { mostrarPin(err.message); }
    finally { $('btnPin').disabled = false; $('btnPin').textContent = 'Entrar'; }
  });

  $('salir').addEventListener('click', () => { pinStore.del(); detenerCam(); $('res').innerHTML = ''; mostrarPin(); });

  /* ---------- Consulta y registro ---------- */
  function extraerCodigo(txt) {
    txt = String(txt || '').trim();
    try { return (new URL(txt).searchParams.get('c') || '').toUpperCase(); }
    catch (e) { return txt.toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  }

  function pintar(tipo, icono, titulo, detalle, conSiguiente) {
    const clase = tipo === 'ok' ? 'ok-bg' : tipo === 'bad' ? 'bad-bg' : 'warn-bg';
    $('res').innerHTML = `
      <div class="estado ${tipo}">
        <div class="icono ${clase}">${icono}</div>
        <h2>${titulo}</h2>
        ${detalle || ''}
        ${conSiguiente ? '<button class="btn sec" id="btnSig" type="button">Siguiente</button>' : ''}
      </div>`;
    if (conSiguiente) $('btnSig').onclick = siguiente;
    $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function siguiente() {
    $('res').innerHTML = '';
    if (camActiva && lector) { try { lector.resume(); } catch (e) {} }
  }

  async function consultar(texto) {
    const codigo = extraerCodigo(texto);
    if (!codigo || ocupado) return;
    ocupado = true;
    pintar('info', '…', 'Buscando', `<p class="mono">${esc(codigo)}</p>`, false);
    try { mostrarBoleta(await api('consultar', { c: codigo, pin: pinStore.get() })); }
    catch (err) { manejarError(err); }
    finally { ocupado = false; }
  }

  // Con dos funciones, la puerta ve en grande a cuál pertenece la boleta
  const tagFuncion = b => b.funcionTxt ? `<p class="funcion-tag">${esc(b.funcionTxt)}</p>` : '';

  function mostrarBoleta(b) {
    if (!b.existe) return pintar('bad', '✕', 'No encontrada', `<p>El código <span class="mono">${esc(b.codigo)}</span> no existe.</p>`, true);
    if (b.estado === 'USADA') return pintar('bad', '⚠', 'YA FUE USADA', `${tagFuncion(b)}<p><strong>${esc(b.nombre)}</strong> · Boleta #${esc(b.numero)}</p><p>Ingresó: ${esc(b.ingreso)}</p>`, true);
    if (b.estado !== 'EMITIDA') return pintar('bad', '✕', 'No válida', `<p>Estado: ${esc(b.estado)}</p>`, true);
    pintar('info', '🎟', 'Boleta válida',
      `${tagFuncion(b)}<p><strong>${esc(b.nombre)}</strong></p>
       <p>Boleta #${esc(b.numero)} · <span class="mono">${esc(b.codigo)}</span></p>
       <button class="btn" id="btnIngreso" type="button">Registrar ingreso</button>
       <button class="link" id="btnCancelar" type="button">Cancelar</button>`, false);
    $('btnIngreso').onclick = () => registrar(b.codigo);
    $('btnCancelar').onclick = siguiente;
  }

  async function registrar(codigo) {
    const btn = $('btnIngreso');
    btn.disabled = true; btn.textContent = 'Registrando…';
    try {
      const r = await api('registrar', { c: codigo, pin: pinStore.get() });
      if (r.resultado === 'OK') {
        pintar('ok', '✓', 'INGRESO OK', `${tagFuncion(r)}<p><strong>${esc(r.nombre)}</strong> · Boleta #${esc(r.numero)}</p>`, true);
        if (navigator.vibrate) navigator.vibrate(120);
      } else {
        mostrarBoleta(r);
      }
    } catch (err) { manejarError(err); }
  }

  function manejarError(err) {
    const msg = String(err && err.message || 'Intenta de nuevo.');
    if (/PIN/i.test(msg)) { pinStore.del(); detenerCam(); return mostrarPin(msg); }
    pintar('bad', '!', 'Error', `<p>${esc(msg)}</p>`, true);
  }

  $('manual').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('codigo').value;
    $('codigo').value = '';
    consultar(v);
  });

  /* ---------- Cámara ---------- */
  $('btnCam').addEventListener('click', async () => {
    if (camActiva) return detenerCam();
    if (!window.Html5Qrcode) return pintar('bad', '!', 'Lector no disponible', '<p>Revisa la conexión y recarga la página.</p>', false);
    $('lector').hidden = false;
    try {
      lector = lector || new Html5Qrcode('lector');
      await lector.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        txt => {
          if (ocupado) return;
          try { lector.pause(true); } catch (e) {}
          consultar(txt);
        }
      );
      camActiva = true;
      $('btnCam').textContent = 'Detener cámara';
      $('btnCam').classList.add('sec');
    } catch (err) {
      $('lector').hidden = true;
      pintar('bad', '!', 'No se pudo abrir la cámara',
        '<p>Dale permiso de cámara a esta página en el navegador (ícono del candado junto a la dirección) y vuelve a intentar.</p>', false);
    }
  });

  async function detenerCam() {
    if (lector && camActiva) { try { await lector.stop(); } catch (e) {} }
    camActiva = false;
    $('lector').hidden = true;
    $('btnCam').textContent = '📷 Escanear QR';
    $('btnCam').classList.remove('sec');
  }

  /* ---------- Inicio ---------- */
  const CODIGO_URL = new URLSearchParams(location.search).get('c') || '';
  if (!pinStore.get()) mostrarPin();
  else { mostrarApp(); if (CODIGO_URL) consultar(CODIGO_URL); }
</script>
